name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Render bundled specimen
        run: swift run specimen-press demo --output "$RUNNER_TEMP/specimen-press.svg"
